<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ForkCast{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        /* Several pages have a one-button form (delete/toggle/mark-cooked) sitting next to other
           inline content -- avoids repeating style="display:inline" at each call site. */
        .inline-form {
            display: inline;
        }

        /* Pico's [role=group] lays out inputs+button side by side, which gets too cramped on
           narrow screens (e.g. the Surprise-me / search filters). Stack them below ~480px. */
        @media (max-width: 480px) {
            [role="group"] {
                flex-direction: column;
            }
            [role="group"] > * {
                border-radius: var(--pico-border-radius) !important;
                margin-bottom: 0.5rem;
            }
        }

        /* The nav grew to 6 links across the session (Recettes/Planning/Courses/Rabais/
           Garde-manger/Déconnexion) -- let it wrap onto multiple lines on narrow screens instead
           of forcing the whole page wider than the viewport. */
        @media (max-width: 600px) {
            nav.container {
                flex-wrap: wrap;
                row-gap: 0.5rem;
            }
            nav.container ul {
                flex-wrap: wrap;
                row-gap: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong><a href="{% url 'recipes:list' %}">ForkCast</a></strong></li>
        </ul>
        {% if user.is_authenticated %}
        <ul>
            <li><a href="{% url 'recipes:list' %}">Recettes</a></li>
            <li><a href="{% url 'recipes:planning' %}">Planning</a></li>
            <li><a href="{% url 'recipes:shopping_list' %}">Courses</a></li>
            <li><a href="{% url 'recipes:deals' %}">Rabais</a></li>
            <li><a href="{% url 'recipes:pantry' %}">Garde-manger</a></li>
            <li><a href="{% url 'recipes:logout' %}">Déconnexion</a></li>
        </ul>
        {% endif %}
    </nav>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <p role="alert">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
