name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Django system check
        run: python manage.py check

      - name: Run test suite
        run: python manage.py test

      # Catches static-file regressions (e.g. a broken {% static %} reference) before they'd
      # only surface at Docker build / deploy time -- see Dockerfile, which runs this same step.
      - name: Collectstatic sanity check
        run: python manage.py collectstatic --noinput
