[project]
name = "forkcast"
version = "0.1.0"
description = "A meal-planning app built around a bidirectional recipe <-> pantry <-> shopping list loop."
requires-python = ">=3.13"
dependencies = [
    "Django==6.1",
    "django-htmx==1.28.0",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "pillow==12.3.0",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "django-storages==1.14.6",
    "boto3==1.43.65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
