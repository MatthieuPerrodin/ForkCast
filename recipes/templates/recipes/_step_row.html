<li>
    {{ form.id }}
    {{ form.order }} {{ form.description }}
    {% if form.instance.pk %}
    <label>{{ form.DELETE }} Supprimer</label>
    {% else %}
    <button type="button" onclick="this.closest('li').remove()">Retirer</button>
    {% endif %}
</li>
{% if next_total %}
<input type="hidden" id="id_steps-TOTAL_FORMS" name="steps-TOTAL_FORMS" value="{{ next_total }}" hx-swap-oob="true">
{% endif %}
